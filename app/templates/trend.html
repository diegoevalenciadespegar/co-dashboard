<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO Dashboard — Tendencia 2026 vs 2025</title>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root { --desp-primary: #17CDDA; --desp-primary-dark: #0FB4C0; --desp-dark: #141C2C; --desp-dark-2: #1E2A42; --bg-light: #F7F8FA; --bg-card: #FFFFFF; --gray-mid: #8B95A6; --gray-light: #EDF0F5; --gray-border: #E2E8F0; --text-positive: #16A34A; --text-negative: #DC2626; --text-primary: #1A202C; --text-secondary: #64748B; --desp-purple: #550FED; --desp-purple-light: #A780FF; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg-light); color: var(--text-primary); min-height: 100vh; }
        .header { background: linear-gradient(135deg, var(--desp-dark) 0%, var(--desp-dark-2) 100%); color: white; padding: 24px 40px; display: flex; align-items: center; gap: 16px; }
        .header-logo { width: 40px; height: 40px; background: var(--desp-primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; color: var(--desp-dark); }
        .nav-tabs { display: flex; gap: 4px; padding: 0 40px; background: var(--desp-dark); }
        .nav-tab { padding: 12px 24px; color: rgba(255,255,255,0.6); text-decoration: none; font-size: 14px; font-weight: 600; border-bottom: 3px solid transparent; transition: all 0.2s; }
        .nav-tab:hover { color: white; }
        .nav-tab.active { color: white; border-bottom-color: var(--desp-primary); }
        .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; }
        .filters-bar { background: var(--bg-card); border-radius: 16px; padding: 18px 24px; margin-bottom: 20px; border: 1px solid var(--gray-border); display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; }
        .filter-group select { padding: 9px 14px; border: 1.5px solid var(--gray-border); border-radius: 10px; font-size: 14px; min-width: 140px; }
        .indicator-chips { display: flex; gap: 8px; flex-wrap: wrap; }
        .chip { padding: 8px 16px; border: 1.5px solid var(--gray-border); border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--bg-card); color: var(--text-secondary); user-select: none; }
        .chip.selected { background: var(--desp-primary); color: var(--desp-dark); border-color: var(--desp-primary); }
        .chip.disabled { opacity: 0.4; cursor: not-allowed; }
        .week-range { display: flex; align-items: center; gap: 12px; }
        .week-range input[type="range"] { -webkit-appearance: none; width: 180px; height: 6px; background: var(--gray-light); border-radius: 10px; }
        .week-range input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: var(--desp-primary); border-radius: 50%; cursor: pointer; }
        .btn-apply { background: var(--desp-primary); color: var(--desp-dark); border: none; padding: 9px 28px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; }
        .card { background: var(--bg-card); border-radius: 16px; padding: 24px; border: 1px solid var(--gray-border); }
        .card-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .card-title i { color: var(--desp-primary); }
        .chart-container { position: relative; height: 500px; width: 100%; }
        .error-msg { background: #FEF2F2; border: 1px solid #FECACA; border-radius: 10px; padding: 14px 20px; color: var(--text-negative); margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-logo">D</div>
        <div><h1>CO Dashboard — Seguimiento de Ventas</h1><p>Análisis unificado de venta semanal | Datos actualizados diariamente</p></div>
    </div>
    <div class="nav-tabs">
        <a href="/" class="nav-tab">Tabla Semanal</a>
        <a href="/daily" class="nav-tab">Venta Diaria</a>
        <a href="/trend" class="nav-tab active">Tendencia 2026 vs 2025</a>
    </div>
    <div class="container">
        {% if error %}<div class="error-msg"><strong>Error:</strong> {{ error }}</div>
        {% else %}
        <div class="filters-bar">
            <div class="filter-group"><label>Marca</label><select id="marca"><option value="">Todas</option>{% for m in filter_options.marcas %}<option value="{{ m }}">{{ m }}</option>{% endfor %}</select></div>
            <div class="filter-group"><label>Producto</label><select id="producto"><option value="">Todos</option>{% for p in filter_options.productos %}<option value="{{ p }}">{{ p }}</option>{% endfor %}</select></div>
            <div class="filter-group"><label>Canal</label><select id="canal"><option value="">Todos</option>{% for c in filter_options.canales %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></div>
            <div class="filter-group"><label>Indicadores (max 2)</label><div class="indicator-chips">
                <div class="chip selected" data-indicator="gb" onclick="toggleIndicator(this)">GB</div>
                <div class="chip" data-indicator="bookings" onclick="toggleIndicator(this)">Bookings</div>
                <div class="chip" data-indicator="asp" onclick="toggleIndicator(this)">ASP</div>
                <div class="chip" data-indicator="fvm" onclick="toggleIndicator(this)">FVM</div>
            </div></div>
            <div class="filter-group"><label>Rango de semanas</label><div class="week-range">
                <span style="font-size:13px;font-weight:600;min-width:44px;text-align:center;" id="wf-label">W1</span>
                <input type="range" id="wf" min="1" max="53" value="1" oninput="updateWeekLabels()">
                <input type="range" id="wt" min="1" max="53" value="53" oninput="updateWeekLabels()">
                <span style="font-size:13px;font-weight:600;min-width:44px;text-align:center;" id="wt-label">W53</span>
            </div></div>
            <button class="btn-apply" onclick="loadChart()">Aplicar</button>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-chart-line"></i> Tendencia 2026 vs 2025</div>
            <div class="chart-container"><canvas id="trendChart"></canvas></div>
        </div>
        {% endif %}
    </div>
    <script>
        const filterOptions = {{ filter_options | tojson }};
        let selectedIndicators = ['gb'];
        let chart = null;
        function toggleIndicator(el) {
            const ind = el.dataset.indicator;
            if (el.classList.contains('selected')) { if (selectedIndicators.length <= 1) return; selectedIndicators = selectedIndicators.filter(i => i !== ind); el.classList.remove('selected'); }
            else { if (selectedIndicators.length >= 2) return; selectedIndicators.push(ind); el.classList.add('selected'); }
            document.querySelectorAll('.chip').forEach(c => { if (!c.classList.contains('selected') && selectedIndicators.length >= 2) c.classList.add('disabled'); else c.classList.remove('disabled'); });
        }
        function updateWeekLabels() { const wf = document.getElementById('wf'), wt = document.getElementById('wt'); if (parseInt(wf.value) > parseInt(wt.value)) wf.value = wt.value; document.getElementById('wf-label').textContent = 'W' + wf.value; document.getElementById('wt-label').textContent = 'W' + wt.value; }
        const indicatorMeta = { 'gb': {c26:'#17CDDA',c25:'#A780FF',label:'GB'}, 'bookings': {c26:'#16A34A',c25:'#86EFAC',label:'Bookings'}, 'asp': {c26:'#550FED',c25:'#C4B5FD',label:'ASP'}, 'fvm': {c26:'#DC2626',c25:'#FCA5A5',label:'FVM'} };
        function fmtVal(v, isMoney) { if (v === null || v === undefined) return null; if (isMoney) { if (v >= 1000000) return '$'+(v/1000000).toFixed(1)+'M'; if (v >= 1000) return '$'+(v/1000).toFixed(1)+'K'; return '$'+Math.round(v); } if (v >= 1000) return (v/1000).toFixed(1)+'K'; return Math.round(v).toLocaleString(); }
        function isMoney(ind) { return ind === 'gb' || ind === 'asp' || ind === 'fvm'; }
        const annotationPlugin = { id:'annotations', afterDatasetsDraw(chart, args, opts) {
            if (!opts || !opts.enabled) return; const { ctx, data, scales } = chart; const indicators = opts.indicators || [];
            indicators.forEach((ind, idx) => {
                const data2026 = data.datasets[idx*2].data, data2025 = data.datasets[idx*2+1].data;
                const yScale = scales[idx === 0 ? 'y' : 'y1']; if (!yScale) return; const colors = indicatorMeta[ind];
                const points = []; for (let i = 0; i < data2026.length; i++) { if (data2026[i] !== null && data2026[i] !== undefined) points.push({idx:i, val:data2026[i], val2025:data2025[i]}); }
                if (points.length < 4) return;
                const annotations = [];
                for (let i = 1; i < points.length-1; i++) { const p=points[i-1].val,c=points[i].val,n=points[i+1].val; if (c>p&&c>n) annotations.push(points[i]); if (c<p&&c<n) annotations.push(points[i]); }
                if (annotations.indexOf(points[0]) === -1) annotations.push(points[0]);
                if (annotations.indexOf(points[points.length-1]) === -1) annotations.push(points[points.length-1]);
                if (annotations.length > 6) { annotations.forEach(pt => { pt.sig = Math.abs(pt.val - (points[Math.max(0,pt.idx-1)]?.val||0)) + Math.abs(pt.val - (points[Math.min(points.length-1,pt.idx+1)]?.val||0)); }); annotations.sort((a,b) => b.sig - a.sig); annotations.splice(6); annotations.sort((a,b) => a.idx - b.idx); }
                const placedBoxes = [];
                annotations.forEach(pt => {
                    const x = scales.x.getPixelForValue(pt.idx), y = yScale.getPixelForValue(pt.val);
                    let v26 = fmtVal(pt.val, isMoney(ind)); let varPct = '';
                    if (pt.val2025 && pt.val2025 > 0) varPct = ((pt.val/pt.val2025-1)*100).toFixed(0)+'%';
                    const label = v26 + (varPct ? ' ('+varPct+')' : '');
                    ctx.font = '600 11px Inter, sans-serif'; const tw = ctx.measureText(label).width;
                    const boxW = tw+14, boxH = 24; let boxX = x-boxW/2, boxY = y-boxH-10;
                    placedBoxes.push({x,y,boxX,boxY,boxW,boxH,label,pointY:y,pointX:x});
                });
                for (let i = 0; i < placedBoxes.length; i++) { for (let j = i+1; j < placedBoxes.length; j++) { const a=placedBoxes[i],b=placedBoxes[j]; if (!(a.boxX+a.boxW<b.boxX||b.boxX+b.boxW<a.boxX) && !(a.boxY+a.boxH<b.boxY||b.boxY+b.boxH<a.boxY)) { if (b.boxY > 20) b.boxY = a.boxY-(a.boxH+6); else a.boxY = b.boxY+b.boxH+6; } } }
                placedBoxes.forEach(box => {
                    ctx.save(); ctx.strokeStyle = colors.c26+'88'; ctx.lineWidth = 1; ctx.setLineDash([3,3]);
                    ctx.beginPath(); ctx.moveTo(box.x, box.boxY+box.boxH); ctx.lineTo(box.pointX, box.pointY); ctx.stroke(); ctx.setLineDash([]);
                    ctx.fillStyle = colors.c26+'15'; ctx.strokeStyle = colors.c26; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.roundRect(box.boxX, box.boxY, box.boxW, box.boxH, 6); ctx.fill(); ctx.stroke();
                    ctx.fillStyle = colors.c26; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(box.label, box.x, box.boxY+box.boxH/2); ctx.restore();
                });
            });
        }};
        function loadChart() {
            const params = new URLSearchParams();
            const marca=..., producto=..., canal=..., wf=..., wt=...;
            // Build params and fetch
            if (document.getElementById('marca').value) params.append('marca', document.getElementById('marca').value);
            if (document.getElementById('producto').value) params.append('producto', document.getElementById('producto').value);
            if (document.getElementById('canal').value) params.append('canal', document.getElementById('canal').value);
            params.append('i1', selectedIndicators[0]); params.append('i2', selectedIndicators[1] || '');
            params.append('wf', document.getElementById('wf').value); params.append('wt', document.getElementById('wt').value);
            fetch('/api/trend?' + params.toString()).then(r => r.json()).then(result => { if (result.error) { alert('Error: ' + result.error); return; } renderChart(result); });
        }
        function renderChart(result) {
            const ctx = document.getElementById('trendChart').getContext('2d'); if (chart) chart.destroy();
            const indicators = result.indicators, datasets = [];
            indicators.forEach((ind, idx) => {
                const meta = indicatorMeta[ind]; const yAxisID = indicators.length === 2 ? (idx === 0 ? 'y' : 'y1') : 'y';
                datasets.push({ label: meta.label+' 2026', data: result.series[ind+'_2026'], borderColor: meta.c26, backgroundColor: meta.c26+'15', borderWidth: 2.5, pointRadius: 3, pointHoverRadius: 7, tension: 0.3, yAxisID, fill: false });
                datasets.push({ label: meta.label+' 2025', data: result.series[ind+'_2025'], borderColor: meta.c25, backgroundColor: meta.c25+'15', borderWidth: 2, pointRadius: 2, pointHoverRadius: 5, borderDash: [6,4], tension: 0.3, yAxisID, fill: false });
            });
            const scalesConfig = { x: { grid: {color:'#F1F5F9'}, ticks: {font:{family:'Inter',size:11},color:'#64748B'} },
                y: { type:'linear', position:'left', grid:{color:'#F1F5F9'}, ticks:{font:{family:'Inter',size:11},color:'#64748B',callback:function(v){if(Math.abs(v)>=1e6)return(v/1e6).toFixed(0)+'M';if(Math.abs(v)>=1e3)return(v/1e3).toFixed(0)+'K';return v;}}, title:{display:true,text:indicatorMeta[indicators[0]]?.label||'',font:{family:'Inter',weight:'600'}} } };
            if (indicators.length === 2) { scalesConfig.y1 = { type:'linear', position:'right', grid:{drawOnChartArea:false}, ticks:{font:{family:'Inter',size:11},color:'#64748B',callback:function(v){if(Math.abs(v)>=1e6)return(v/1e6).toFixed(0)+'M';if(Math.abs(v)>=1e3)return(v/1e3).toFixed(0)+'K';return v;}}, title:{display:true,text:indicatorMeta[indicators[1]]?.label||'',font:{family:'Inter',weight:'600'}} }; }
            chart = new Chart(ctx, { type:'line', data:{labels:result.weeks,datasets}, options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',labels:{font:{family:'Inter',size:12,weight:'600'},padding:16,usePointStyle:true}},tooltip:{callbacks:{label:function(c){const v=c.parsed.y;if(v===null)return c.dataset.label+': Sin data';const isM=c.dataset.label.includes('GB')||c.dataset.label.includes('ASP')||c.dataset.label.includes('FVM');if(isM&&Math.abs(v)>=1e6)return c.dataset.label+': $'+(v/1e6).toFixed(1)+'M';if(isM&&Math.abs(v)>=1e3)return c.dataset.label+': $'+(v/1e3).toFixed(1)+'K';if(!isM&&Math.abs(v)>=1e3)return c.dataset.label+': '+(v/1e3).toFixed(1)+'K';return c.dataset.label+': '+Math.round(v);}}},annotations:{enabled:true,indicators:indicators}},scales:scalesConfig}, plugins:[annotationPlugin] });
        }
        loadChart();
    </script>
</body>
</html>
